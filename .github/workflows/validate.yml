name: validate

on:
  # Automatic validation is temporarily paused; run this workflow manually.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Repository validation
        run: ./scripts/validate.sh
      - name: hod CLI behavioral tests
        run: ./scripts/test-hod.sh
